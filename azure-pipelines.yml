trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/dev/**
      - modules/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - environments/dev/**
      - modules/**

variables:
  TF_VERSION: "1.5.0"
  WORKING_DIR: "environments/dev"
  BACKEND_RG: "Devyani-RG"
  BACKEND_SA: "devyani543212"
  BACKEND_CONTAINER: "tfstate"
  BACKEND_KEY: "dev/terraform.tfstate"
  AZURE_SERVICE_CONNECTION: "Deenanath-pipeline"

pool: Technova-Agent

stages:

  # ─────────────────────────────────────────
  # STAGE 1: Validate & Plan (on every PR)
  # ─────────────────────────────────────────
  - stage: Plan
    displayName: "Terraform Plan"
    jobs:
      - job: TerraformPlan
        displayName: "Init + Validate + Plan"
        steps:

          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: $(WORKING_DIR)
              backendServiceArm: "$(AZURE_SERVICE_CONNECTION)"
              backendAzureRmResourceGroupName: $(BACKEND_RG)
              backendAzureRmStorageAccountName: $(BACKEND_SA)
              backendAzureRmContainerName: $(BACKEND_CONTAINER)
              backendAzureRmKey: $(BACKEND_KEY)

          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: $(WORKING_DIR)

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: $(WORKING_DIR)
              commandOptions: "-var-file=terraform.tfvars -out=tfplan"
              environmentServiceNameAzureRM: "$(AZURE_SERVICE_CONNECTION)"

          # Plan output ko artifact ke roop mein save karo
          - task: PublishPipelineArtifact@1
            displayName: "Publish Plan Artifact"
            inputs:
              targetPath: "$(WORKING_DIR)/tfplan"
              artifact: "tfplan"
              publishLocation: "pipeline"

  # ─────────────────────────────────────────
  # STAGE 2: Apply (sirf main branch pe)
  # ─────────────────────────────────────────
  - stage: Apply
    displayName: "Terraform Apply"
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: TerraformApply
        displayName: "Apply to Dev"
        environment: "dev"        # Azure DevOps Environment — manual approval yahan set karo
        strategy:
          runOnce:
            deploy:
              steps:

                - task: TerraformInstaller@1
                  displayName: "Install Terraform $(TF_VERSION)"
                  inputs:
                    terraformVersion: $(TF_VERSION)

                # Plan artifact download karo
                - task: DownloadPipelineArtifact@2
                  displayName: "Download Plan Artifact"
                  inputs:
                    artifact: "tfplan"
                    path: "$(Pipeline.Workspace)/tfplan"

                - task: TerraformTaskV4@4
                  displayName: "Terraform Init"
                  inputs:
                    provider: "azurerm"
                    command: "init"
                    workingDirectory: $(WORKING_DIR)
                    backendServiceArm: "$(AZURE_SERVICE_CONNECTION)"
                    backendAzureRmResourceGroupName: $(BACKEND_RG)
                    backendAzureRmStorageAccountName: $(BACKEND_SA)
                    backendAzureRmContainerName: $(BACKEND_CONTAINER)
                    backendAzureRmKey: $(BACKEND_KEY)

                - task: TerraformTaskV4@4
                  displayName: "Terraform Apply"
                  inputs:
                    provider: "azurerm"
                    command: "apply"
                    workingDirectory: $(WORKING_DIR)
                    commandOptions: "$(Pipeline.Workspace)/tfplan/tfplan"
                    environmentServiceNameAzureRM: "$(AZURE_SERVICE_CONNECTION)"
